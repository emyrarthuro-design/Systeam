name: Firestore Security Rules (Emulator)
on:
  push:
    branches:
      - feature/ruta-cero-agentes-mvp
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app
        run: npm ci
      - name: Install emulator test tools (ephemeral CI only)
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.0 firebase-tools@14.26.0
      - name: Test rules against isolated demo project emulator
        env:
          CI: true
        run: ./node_modules/.bin/firebase emulators:exec --project demo-ruta-cero-security --config firebase.ci.json --only firestore "node --test tests/firestoreRules.test.mjs"
