name: Validate Systeam (TypeScript and build)
on:
  push:
    branches:
      - feature/ruta-cero-agentes-mvp
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
