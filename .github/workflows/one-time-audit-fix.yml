name: One-time safe npm audit fix
on:
  push:
    branches:
      - feature/ruta-cero-agentes-mvp
permissions:
  contents: write
jobs:
  patch-lockfile:
    if: "github.event.head_commit.message == 'chore(security): run nonbreaking audit fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply compatible transitive security fixes only
        run: npm audit fix --package-lock-only || true
      - name: Commit lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): apply compatible security fixes"
            git push origin HEAD:feature/ruta-cero-agentes-mvp
          fi
